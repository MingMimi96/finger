<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
<script>window.ml5={handPose:()=>({detectStart(){}})};</script>
<script src="finger.js"></script>
<script>
let src;
preload = function(){ src = loadImage('../sketch/img.png'); };
setup = function(){
  pixelDensity(1); createCanvas(960, 560); background(40);
  src.resize(300, 0);
  STYLES.forEach((s,k)=>{
    const img = src.get(); s.apply(img);
    const x = (k%3)*320+10, y = floor(k/3)*280+10;
    image(img, x, y);
    if (s.decorate) s.decorate(x, y, img.width, img.height);
    fill(255); stroke(0); strokeWeight(3); textSize(16); text(s.name, x+8, y+22); noStroke();
  });
  noLoop(); window.__done = true;
};
draw = function(){};
</script></head><body style="margin:0"></body></html>
